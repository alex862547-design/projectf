<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <!-- ปิดการซูมด้วยนิ้ว (pinch/double-tap) บนมือถือ เพราะหน้าเว็บนี้เป็นแอปแดชบอร์ดที่มีแถบบนค้าง (sticky)
         ถ้าซูมได้จะทำให้ระยะ/ตำแหน่งของแถบบนกับส่วนอื่นเลื่อนเพี้ยนไปจากที่ตั้งใจ -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="color-scheme" content="light dark" />
    <title>sports-system</title>

    <!-- ทำให้ "เพิ่มไปหน้าจอโฮม" บนมือถือได้ไอคอนแอปจริง (ไม่ใช่แค่บุ๊กมาร์ก) กดแล้วเปิดแบบเต็มจอไม่มีแถบ URL -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#3D348B" />
    <link rel="apple-touch-icon" href="/app-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="กีฬาสี" />
    <script>
      // ตั้งธีมก่อนเพจ render เพื่อกันภาพกะพริบผิดสีตอนโหลด (ค่าเริ่มต้น = โหมดมืด)
      (function () {
        var theme = localStorage.getItem("theme") || "dark";
        if (theme === "dark") document.documentElement.classList.add("dark");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
